name: Restore original team photos from blobs
on:
  push:
    branches:
      - agent/restore-original-team-photos
    paths:
      - .github/workflows/restore-original-team-from-blobs.yml

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-original-team-photos

      - name: Restore exact original photo blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p assets/images/team
          fetch_blob() {
            local sha="$1" path="$2"
            gh api "repos/${REPO}/git/blobs/${sha}" --jq .content | tr -d '\n' | base64 -d > "$path"
            actual="$(git hash-object "$path")"
            test "$actual" = "$sha" || { echo "SHA mismatch for $path: $actual != $sha"; exit 1; }
          }
          fetch_blob d90e38d07f921908fdf8e8d9670ce916932f6897 assets/images/team/andika-fajrillah-cahyadi.webp
          fetch_blob a2ead5e66c9ae0bf341bf2b1291f1503b68cd9ae assets/images/team/arlinggawrdhni.jpg
          fetch_blob e2bb4391dfd70510ee946dc60cff31bf8f10e538 assets/images/team/chevamrryaan.jpg
          fetch_blob 8ad318bc7f7702a6f2634dff78b00e669c3c615c assets/images/team/dedeniqbal18.jpg
          cp assets/images/team/dedeniqbal18.jpg assets/images/team/foto-placeholder.jpg
          test "$(git hash-object assets/images/team/foto-placeholder.jpg)" = "8ad318bc7f7702a6f2634dff78b00e669c3c615c"
          fetch_blob 3525f56dfb63a7dbeb10444294446667ed515850 assets/images/team/juan-grld.jpg
          fetch_blob d19f3e752a96ea256aa1aa924013f94ce54bd52b assets/images/team/kael.webp
          fetch_blob 6fe9e8c82f665dc105d5766f04d21f92b8b09471 assets/images/team/m-rajeb.webp
          fetch_blob 8b04ab35c735e04501c5ac21928554e38b47539a assets/images/team/magesta-dwitama-putra.webp
          fetch_blob 3987feb5a2eafe01710e9d30fccdc75711045ee8 assets/images/team/nevi-nadia.webp
          fetch_blob abc575700b9fa9867ef076766ca39da92cfa1732 assets/images/team/pputrawjy.jpg
          fetch_blob 73be87fa7e95e30fb0c24e194b52567874db73c0 assets/images/team/raisya-rahmawati.webp
          fetch_blob 815c40db66a90434b204e8d27aa7eba814d89854 assets/images/team/zaa-frhan.jpg

          rm -rf .restore-hires .restore-hires-large
          rm -f .github/workflows/restore-original-team-from-blobs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original-resolution team photos"
          git push
