name: Materialize KKN website update

on:
  push:
    branches:
      - agent/update-kkn-website

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Materialize staged files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import pathlib
          import shutil

          root = pathlib.Path('assets/images/team')

          # Team image payloads stored as filename|base64 lines.
          for map_file in sorted(root.glob('chunk-*.b64map')):
              for line in map_file.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  name, encoded = line.split('|', 1)
                  (root / name).write_bytes(base64.b64decode(encoded))

          direct = root / 'm-rajeb.webp.b64'
          if direct.exists():
              (root / 'm-rajeb.webp').write_bytes(base64.b64decode(direct.read_text(encoding='utf-8').strip()))

          # The source ZIP contains the same bytes for these two files.
          (root / 'foto-placeholder.jpg').write_bytes((root / 'dedeniqbal18.jpg').read_bytes())

          staging = pathlib.Path('.staging')
          code_targets = {
              'index.html.gz.b64': pathlib.Path('index.html'),
              'site.css.gz.b64': pathlib.Path('assets/site.css'),
              'site.js.gz.b64': pathlib.Path('assets/site.js'),
          }
          for staged_name, target in code_targets.items():
              payload = (staging / staged_name).read_text(encoding='utf-8').strip()
              target.write_bytes(gzip.decompress(base64.b64decode(payload)))

          for map_file in root.glob('chunk-*.b64map'):
              map_file.unlink()
          if direct.exists():
              direct.unlink()
          if staging.exists():
              shutil.rmtree(staging)

          workflow = pathlib.Path('.github/workflows/materialize-kkn-update.yml')
          if workflow.exists():
              workflow.unlink()
          workflows_dir = pathlib.Path('.github/workflows')
          if workflows_dir.exists() and not any(workflows_dir.iterdir()):
              workflows_dir.rmdir()
          github_dir = pathlib.Path('.github')
          if github_dir.exists() and not any(github_dir.iterdir()):
              github_dir.rmdir()
          PY

      - name: Commit materialized update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Materialize KKN website update"
          git push
